# Security PRs for high/critical alerts are opened by the org-level Dependabot rule; this file does
# not enable version-update PRs (open-pull-requests-limit: 0). It names the reviewers and assignee
# for the PRs Dependabot opens and, where present, lets Dependabot read the private @minware npm
# packages. CODEOWNERS is generated from the reviewers listed here (dependabot/codeowner-migration-action).
# Rolled out to every deployed repo from the same generator; keep it in step.
version: 2
registries:
  npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: "*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    reviewers:
      - CTaylor1118
      - KBorders01
      - aaboyd
    assignees:
      - CTaylor1118
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    reviewers:
      - CTaylor1118
      - KBorders01
      - aaboyd
    assignees:
      - CTaylor1118